[project]
name = "adskoe_api"
version = "0.1.0"
description = "бложик"
authors = [{ name = "ubicasmerti666" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic[email]"
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]

[tool.ruff.format]
indent-style = "space"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"